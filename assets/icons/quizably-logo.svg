<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" role="img" aria-label="Quizably">
  <title>Quizably</title>
  <!-- Icon: "picked answer" — 4 multiple-choice options, one selected and
       confirmed. Replaces the old connected-circles/question-mark motif,
       which read as a flowchart rather than a mark at small sizes. Fully
       inside the viewBox with margin on every side, no element crosses an
       edge (Image rules, CLAUDE.md). -->
  <g fill="none" stroke="#FE904D" stroke-width="7">
    <circle cx="28" cy="28" r="20" />
    <circle cx="92" cy="28" r="20" />
    <circle cx="28" cy="92" r="20" />
  </g>
  <circle cx="92" cy="92" r="21" fill="#FE904D" />
  <path d="M81 92 L89 100 L105 82" fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Wordmark. Loaded via <img src>, so it can't reach the app's Fraunces
       webfont (an <img>-embedded SVG renders outside the parent page's
       CSS) — system serif fallback is the actual working choice here, not
       just a fallback. -->
  <text x="136" y="82" fill="#0A0A0B" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="62" letter-spacing="0.5">Quiz<tspan fill="#FE904D" font-style="italic" font-weight="500">ably</tspan></text>
</svg>
