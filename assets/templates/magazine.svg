<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Geist,system-ui,sans-serif">
  <defs>
    <linearGradient id="mg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="mg-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(0,0,0,0.0)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0.55)"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#mg-bg)"/>
  <rect width="640" height="400" fill="url(#mg-shade)"/>

  <!-- Issue label / page kicker -->
  <text x="36" y="40" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#FBBF24" letter-spacing="3">ISSUE 12 · PERSONALITY</text>

  <!-- Bold editorial title -->
  <text x="36" y="120" font-family="Cambria,Georgia,serif" font-size="48" font-weight="600" fill="#fff" letter-spacing="-1.5">Which 90s</text>
  <text x="36" y="172" font-family="Cambria,Georgia,serif" font-size="48" font-weight="600" font-style="italic" fill="#FBBF24" letter-spacing="-1.5">cartoon hero</text>
  <text x="36" y="224" font-family="Cambria,Georgia,serif" font-size="48" font-weight="600" fill="#fff" letter-spacing="-1.5">are you?</text>

  <!-- 4-up colorful tile grid -->
  <g transform="translate(36 270)">
    <rect x="0" y="0" width="138" height="100" rx="12" fill="#FBBF24"/>
    <text x="14" y="24" font-family="Cambria,Georgia,serif" font-size="22" font-weight="600" fill="#0A0A0B">A</text>
    <text x="14" y="74" font-size="12" fill="#0A0A0B" font-weight="500">The brave one</text>
  </g>
  <g transform="translate(186 270)">
    <rect x="0" y="0" width="138" height="100" rx="12" fill="#34D399"/>
    <text x="14" y="24" font-family="Cambria,Georgia,serif" font-size="22" font-weight="600" fill="#0A0A0B">B</text>
    <text x="14" y="74" font-size="12" fill="#0A0A0B" font-weight="500">The wise one</text>
  </g>
  <g transform="translate(336 270)">
    <rect x="0" y="0" width="138" height="100" rx="12" fill="#F87171"/>
    <text x="14" y="24" font-family="Cambria,Georgia,serif" font-size="22" font-weight="600" fill="#fff">C</text>
    <text x="14" y="74" font-size="12" fill="#fff" font-weight="500">The funny one</text>
  </g>
  <g transform="translate(486 270)">
    <rect x="0" y="0" width="118" height="100" rx="12" fill="#0A0A0B"/>
    <text x="14" y="24" font-family="Cambria,Georgia,serif" font-size="22" font-weight="600" fill="#FBBF24">D</text>
    <text x="14" y="74" font-size="12" fill="#fff" font-weight="500">The mysterious one</text>
  </g>
</svg>
