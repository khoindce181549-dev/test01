<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Geist,system-ui,sans-serif">
  <defs>
    <linearGradient id="fs-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#fs-bg)"/>
  <rect x="48" y="36" width="68" height="6" rx="3" fill="#A5B4FC"/>
  <text x="48" y="120" font-family="Cambria,Georgia,serif" font-size="44" font-weight="500" fill="#fff" letter-spacing="-1.2">Which path</text>
  <text x="48" y="172" font-family="Cambria,Georgia,serif" font-size="44" font-weight="500" font-style="italic" fill="#A5B4FC" letter-spacing="-1.2">do you choose?</text>
  <rect x="48" y="220" width="544" height="44" rx="22" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
  <text x="68" y="248" font-size="14" fill="#E0E7FF" font-weight="500">A</text>
  <text x="92" y="248" font-size="14" fill="#fff">The road less traveled</text>
  <rect x="48" y="276" width="544" height="44" rx="22" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
  <text x="68" y="304" font-size="14" fill="#E0E7FF" font-weight="500">B</text>
  <text x="92" y="304" font-size="14" fill="#fff">The well-paved highway</text>
  <rect x="48" y="364" width="180" height="3" rx="1.5" fill="rgba(255,255,255,0.2)"/>
  <rect x="48" y="364" width="80" height="3" rx="1.5" fill="#A5B4FC"/>
</svg>
