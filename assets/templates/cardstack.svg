<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Geist,system-ui,sans-serif">
  <rect width="640" height="400" fill="#FAFAF7"/>

  <!-- Behind cards (offset + scale + opacity) -->
  <g transform="translate(320 200) rotate(-2)">
    <rect x="-150" y="-200" width="300" height="380" rx="20" fill="#fff" stroke="#EAE8E1" opacity="0.5"/>
  </g>
  <g transform="translate(320 195) rotate(1)">
    <rect x="-150" y="-200" width="300" height="380" rx="20" fill="#fff" stroke="#EAE8E1" opacity="0.75"/>
  </g>

  <!-- Top card -->
  <g transform="translate(320 192) rotate(-1)">
    <rect x="-150" y="-200" width="300" height="380" rx="20" fill="#fff" stroke="#EAE8E1" filter="drop-shadow(0 8px 24px rgba(10,10,11,0.08))"/>
    <text x="-130" y="-160" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#9A9A9F" letter-spacing="2">QUESTION 03</text>
    <text x="-130" y="-100" font-family="Cambria,Georgia,serif" font-size="26" font-weight="500" fill="#0A0A0B" letter-spacing="-0.5">Pizza or</text>
    <text x="-130" y="-72" font-family="Cambria,Georgia,serif" font-size="26" font-weight="500" font-style="italic" fill="#4F46E5" letter-spacing="-0.5">pasta?</text>
    <rect x="-130" y="-40" width="260" height="140" rx="12" fill="url(#cs-img)"/>
    <defs>
      <linearGradient id="cs-img" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FBBF24"/>
        <stop offset="1" stop-color="#F87171"/>
      </linearGradient>
    </defs>
  </g>

  <!-- Swipe hints at bottom -->
  <g transform="translate(320 360)">
    <circle cx="-46" cy="0" r="22" fill="#fff" stroke="#EAE8E1"/>
    <path d="M-52,-4 l-6,4 l6,4" stroke="#9A9A9F" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="46" cy="0" r="22" fill="#4F46E5"/>
    <path d="M40,-4 l6,4 l-6,4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
